<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pradhan by Panchayat | Website versions</title>
<meta name="description" content="Design iterations of the Pradhan by Panchayat website.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23111'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='Georgia' font-size='22' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink: #141414; --muted: #6b6b66; --line: #e6e4de; --bg: #f6f5f1; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 system-ui, 'Segoe UI', Arial, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font: 600 clamp(30px, 4vw, 44px)/1.1 Georgia, 'Times New Roman', serif; margin: 0 0 10px; }
  .lead { color: var(--muted); margin: 0 0 36px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
  .v { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; display: grid; transition: transform .25s, box-shadow .25s; }
  .v:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0, 0, 0, .08); }
  .v img { width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; display: block; background: #e9e7e1; }
  .v div { padding: 16px 18px 20px; display: grid; gap: 6px; }
  .v .t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .v b { font-size: 19px; font-weight: 600; }
  .v .id { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px; margin-right: 8px; }
  .v small { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .v p { margin: 0; color: #4a4a45; font-size: 15px; }
  .v .latest { color: #3f5c09; font-weight: 600; font-size: 13px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .v { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Pradhan by Panchayat</h1>
  <p class="lead">Website design iterations. Open any version, and switch between them with the “Version” button in the bottom-left corner of every page.</p>
  <div class="grid" id="versions">
    <noscript><a class="v" href="v1/"><div><b>v1 · KSHM layout</b></div></a></noscript>
  </div>
  <footer>A TVF brand · Previews use sample products and prices.</footer>
</main>
<script src="versions.js"></script>
<script>
  (function () {
    var list = window.PBP_VERSIONS || [];
    var latest = list.length ? list[list.length - 1].id : '';
    document.getElementById('versions').innerHTML = list.slice().reverse().map(function (v) {
      return '<a class="v" href="' + v.id + '/">' +
        '<img src="' + v.thumb + '" alt="' + v.id + ' homepage" width="960" height="600" loading="lazy">' +
        '<div><span class="t"><b><span class="id">' + v.id + '</span>' + v.name + '</b><small>' + v.date + '</small></span>' +
        (v.id === latest ? '<span class="latest">Latest</span>' : '') +
        '<p>' + v.note + '</p></div></a>';
    }).join('');
  })();
</script>
</body>
</html>
